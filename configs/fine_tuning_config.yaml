# NVILA-15B Fine-tuning Configuration

# Model Configuration
model:
  name: "NVILA-15B"  # Model name
  base_path: "./models/NVILA-15B"  # Path to the model directory

# Data Configuration
data:
  train_data:
    - name: "NW-test-camera-1"
      path: "data/vila-dataset/NW-test-camera-1/data_vila_format.json"
      weight: 1.0  # Weight of this dataset in the mixture
  validation_data:
    # We'll use a portion of each dataset for validation
    - name: "NW-test-camera-1"
      path: "data/vila-dataset/NW-test-camera-1/data_vila_format.json"
      weight: 1.0
  test_data:
    - name: "PI-test-camera-1"
      path: "data/vila-dataset/PI-test-camera-1/data_vila_format.json"
      weight: 1.0
  
  # Data Split Configuration
  split_strategy:
    train_ratio: 0.8
    val_ratio: 0.2
    random_seed: 42  # For reproducibility
    
  image_folder: "data/vila-dataset/"
  image_aspect_ratio: "pad"
  num_video_frames: 4  # Reduced from 8 to save memory

# Training Hyperparameters
training:
  # Optimizer settings
  optimizer:
    name: "adamw_torch"
    learning_rate: 2.0e-5  # Learning rate for fine-tuning
    weight_decay: 0.0      # Weight decay for regularization
    
  # Training schedule
  lr_scheduler:
    name: "cosine"         # Cosine learning rate scheduler
    warmup_ratio: 0.03     # Warm up for first 3% of training steps
    
  # Training parameters
  epochs: 3                # Number of training epochs
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16  # Reduced back to 16 (was 32)
  max_steps: -1            # -1 means train for full epochs
  
  # Logging and Save/Eval frequency
  logging_steps: 10
  save_steps: 100
  eval_steps: 50
  save_total_limit: 3
  save_strategy: "steps"
  evaluation_strategy: "steps"
  report_to: "tensorboard"
  
  # Model components to tune
  tune_vision_tower: false  # Freeze vision tower
  tune_language_model: true  # Fine-tune the language model
  tune_mm_projector: true   # Fine-tune the multimodal projector
  
  # Precision
  model_dtype: "torch.bfloat16"  # Use bfloat16 for training efficiency
  fp16: false
  bf16: true
  tf32: true
  
  # Sequence length
  model_max_length: 1024   # Reduced further from 2048 to save memory
  
  # LoRA settings (for parameter-efficient fine-tuning)
  lora:
    enable: true           # Enable LoRA for efficient fine-tuning
    r: 64                  # LoRA rank
    alpha: 16              # LoRA alpha
    dropout: 0.05          # LoRA dropout
    bias: "none"           # LoRA bias
    llm: true              # Apply LoRA to language model
  
  # DeepSpeed configuration
  deepspeed_config:
    stage: 3                # DeepSpeed ZeRO stage
    offload: false          # Don't offload to CPU
    
  # Other args
  seed: 42
  disable_tqdm: false
  local_rank: -1
    
# Evaluation Configuration
evaluation:
  metrics:
    - "loss"               # Training loss
    - "perplexity"         # Perplexity on validation set
    - "accuracy"           # Accuracy for generation tasks 