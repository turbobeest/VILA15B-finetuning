# Test fine-tuning configuration for NVILA-15B

model:
  name: "NVILA-15B"
  base_path: "models/NVILA-15B"

data:
  train_data_path: "data/processed/NW-test-camera-1.json"
  image_folder: "data/processed/images"
  video_folder: "data/processed/videos"

training:
  output_dir: "output/NW-test-camera-1"
  num_epochs: 1
  batch_size: 4
  learning_rate: 2.0e-5
  lora:
    enable: true
    r: 8
    alpha: 16
    dropout: 0.05
    bias: "none"
  optimizer: "adamw_torch"
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler: "cosine"
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  fp16: true
  bf16: false
  save_strategy: "steps"
  save_steps: 100
  eval_steps: 100
  logging_steps: 10
  eval_strategy: "steps"
  dataloader_num_workers: 4
  group_by_length: false
  save_total_limit: 3
  seed: 42 