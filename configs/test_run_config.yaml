# NVILA-15B Fine-tuning Test Configuration

# Model Configuration
model:
  name: "NVILA-15B"  # Model name
  base_path: "./models/NVILA-15B"  # Path to the model directory

# Data Configuration
data:
  train_data:
    - name: "NW-test-camera-1"
      path: "data/processed/NW-test-camera-1.json"
      weight: 1.0  # Weight of this dataset in the mixture
  
  # Data Split Configuration
  split_strategy:
    train_ratio: 0.8
    random_seed: 42  # For reproducibility
    
  image_folder: "data/processed/"
  image_aspect_ratio: "pad"
  num_video_frames: 8  # Number of frames to sample from each video

# Training Hyperparameters
training:
  # Optimizer settings
  optimizer:
    name: "adamw_torch"
    learning_rate: 2.0e-5  # Learning rate for fine-tuning
    weight_decay: 0.0      # Weight decay for regularization
    
  # Training schedule
  scheduler:
    type: "cosine"         # Cosine learning rate scheduler
    warmup_ratio: 0.03     # Warm up for first 3% of training steps
    
  # Training parameters
  epochs: 1                # Number of training epochs
  batch_size: 1            # Per-device batch size
  gradient_accumulation_steps: 4  # Effective batch size = batch_size * gradient_accumulation_steps
  max_steps: 10            # Only run for 10 steps to test
  
  # Model components to tune
  tune_vision_tower: false  # Freeze vision tower
  tune_language_model: true  # Fine-tune the language model
  tune_mm_projector: true   # Fine-tune the multimodal projector
  
  # Precision
  model_dtype: "torch.bfloat16"  # Use bfloat16 for training efficiency
  
  # Sequence length
  model_max_length: 1024   # Maximum sequence length for training
  
  # LoRA settings (for parameter-efficient fine-tuning)
  lora:
    enable: true           # Enable LoRA for efficient fine-tuning
    r: 16                  # LoRA rank
    alpha: 16              # LoRA alpha
    dropout: 0.05          # LoRA dropout
    bias: "none"           # LoRA bias
    llm: true              # Apply LoRA to language model
    
  # Save configuration
  save_strategy: "steps"    # Save model on steps
  save_steps: 5             # Save checkpoint every 5 steps
  save_total_limit: 1       # Keep only 1 checkpoint to save disk space
  
  # Evaluation
  evaluation_strategy: "steps"  # Evaluate on steps
  eval_steps: 5              # Evaluate every 5 steps
