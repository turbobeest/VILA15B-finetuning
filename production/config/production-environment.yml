name: vila-production
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10
  - pip=23.0

  # PyTorch with CUDA support
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7

  # VILA dependencies
  - transformers=4.31.0
  - huggingface_hub=0.16.4
  - peft=0.4.0
  - accelerate=0.21.0
  - tokenizers=0.13.3
  - timm=0.9.2
  - safetensors=0.3.2
  - einops=0.6.1
  - deepspeed=0.9.5
  
  # Image and video processing
  - opencv=4.7.0
  - pillow=10.0.0
  - ffmpeg=6.0
  
  # Utilities
  - pyyaml=6.0
  - tqdm=4.65.0
  - loguru=0.7.0
  - psutil=5.9.5
  - pandas=2.0.3
  - numpy=1.25.0
  
  # Monitoring and logging
  - tensorboard=2.13.0
  
  # Pip dependencies for specific packages
  - pip:
    - flash-attn==2.1.0  # Flash attention
    - s2wrapper==0.0.2   # For Segment Anything
    - -e /opt/ml-system/production/services/vila  # Install VILA in editable mode from the production directory

# Notes:
# - This environment file only includes production dependencies, not development tools
# - All package versions are pinned for reproducibility
# - The VILA package should be installed in editable mode from the production services directory
# - Use conda env create -f production-environment.yml to create this environment 